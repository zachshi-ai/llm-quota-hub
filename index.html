<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F8FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>额度中枢</title>
<style>
  :root{
    --bg:#F7F8FA;
    --panel:#FFFFFF;
    --fill:#F2F3F5;
    --line:#E5E6EB;
    --line-strong:#DEE0E3;
    --txt:#1D2129;
    --sub:#4E5969;
    --dim:#6B7785;
    --primary:#3370FF;
    --primary-deep:#2E62D9;
    --primary-soft:#E8F0FF;
    --green:#00B42A;
    --green-soft:#E8FFEA;
    --amber:#FF7D00;
    --amber-soft:#FFF3E8;
    --red:#F53F3F;
    --red-soft:#FFECE8;
    --shadow:0 1px 2px rgba(29,33,41,.04),0 4px 12px rgba(29,33,41,.04);
    --safe:env(safe-area-inset-bottom,0px);
    --top:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;color:var(--txt);background:var(--bg);
    font:15px/1.57 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 0 calc(96px + var(--safe));
    overflow-x:hidden;
  }
  .wrap{max-width:600px;margin:0 auto;padding:0 12px}

  /* ---------- 顶栏（飞书式白底导航） ---------- */
  .topbar{display:flex;align-items:center;gap:10px;
    padding:calc(12px + var(--top)) 2px 12px;margin-bottom:4px}
  .brand{display:flex;align-items:center;gap:9px;min-width:0}
  .mark{width:28px;height:28px;border-radius:7px;flex:none;position:relative;
    background:linear-gradient(160deg,#4E83FD,#2E62D9);
    box-shadow:0 2px 6px rgba(51,112,255,.28)}
  .mark::after{content:"";position:absolute;inset:0;
    background:
      linear-gradient(#fff,#fff) 7px 8px/14px 2.4px no-repeat,
      linear-gradient(#fff,#fff) 7px 13px/10px 2.4px no-repeat,
      linear-gradient(#fff,#fff) 7px 18px/6px 2.4px no-repeat;
    opacity:.95;border-radius:2px}
  h1{font-size:17px;margin:0;font-weight:600;color:var(--txt);letter-spacing:.2px;line-height:1.3}
  .meta-line{font-size:12px;color:var(--dim);margin-top:1px}
  .lockbtn{flex:none;width:32px;height:32px;border-radius:6px;display:grid;place-items:center;
    background:#fff;border:1px solid var(--line);color:var(--sub);padding:0}
  .lockbtn:active{background:var(--fill)}

  /* ---------- 卡片 ---------- */
  .card{
    position:relative;border-radius:8px;padding:16px;margin-bottom:10px;
    background:var(--panel);border:1px solid var(--line);
    box-shadow:var(--shadow);
  }
  .chead{display:flex;align-items:center;gap:8px;min-height:24px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:none}
  .s-ok .dot{background:var(--green)}
  .s-expiring .dot{background:var(--amber)}
  .s-error .dot,.s-unauthenticated .dot{background:var(--red)}
  .pname{font-size:16px;font-weight:600;color:var(--txt)}
  .badge{font-size:11px;font-weight:500;padding:1px 7px;border-radius:4px;white-space:nowrap;
    background:var(--primary-soft);color:var(--primary);border:1px solid transparent}
  .badge.coding_plan{background:#F5E8FF;color:#722ED1}
  .badge.balance{background:var(--green-soft);color:#009A29}
  .badge.usage{background:var(--fill);color:var(--sub)}
  .chead .spacer{flex:1}
  .state{font-size:12px;color:var(--dim);margin-left:auto}
  .state.warn{color:var(--amber)}

  /* ---------- 大号数字 ---------- */
  .heroes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .tile{padding:12px 12px 11px;border-radius:6px;background:var(--fill)}
  .tile .k{font-size:12px;color:var(--sub)}
  .tile .v{font-size:32px;font-weight:600;letter-spacing:-.02em;margin-top:2px;line-height:1.15;
    color:var(--txt);font-variant-numeric:tabular-nums}
  .tile .v small{font-size:13px;font-weight:500;color:var(--sub);margin-left:1px}
  .tile .hint{font-size:11px;color:var(--dim);margin-top:6px}

  .sec-title{display:flex;align-items:center;gap:8px;margin:18px 0 0;
    font-size:12px;color:var(--dim)}
  .sec-title::after{content:"";flex:1;height:1px;background:var(--line)}

  /* ---------- 模型明细 ---------- */
  .model{padding-top:14px;margin-top:14px;border-top:1px solid var(--line)}
  .model:first-of-type{border-top:none;margin-top:8px;padding-top:0}
  .mhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .mname{font-size:14px;font-weight:600;color:var(--txt)}
  .mname em{font-style:normal;font-size:11px;color:var(--dim);margin-left:6px;font-weight:400}
  .mrow{margin-top:12px}
  .mlab{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;color:var(--sub)}
  .mlab b{color:var(--txt);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
  .bar{height:6px;border-radius:3px;background:#EDEEF1;overflow:hidden;margin-top:7px}
  .bar i{display:block;height:100%;border-radius:3px;background:var(--primary);
    transition:width .5s ease}
  .bar i.ok{background:var(--green)}
  .bar i.warn{background:var(--amber)}
  .bar i.low{background:var(--red)}
  .mhint{font-size:11.5px;color:var(--dim);margin-top:6px}

  /* ---------- 余额 / 元信息 ---------- */
  .money{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
    margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .money .amt{font-size:24px;font-weight:600;letter-spacing:-.02em;color:var(--txt);
    font-variant-numeric:tabular-nums}
  .money .amt small{font-size:12px;color:var(--dim);font-weight:400;margin-left:4px}
  .money .split{font-size:11.5px;color:var(--dim);text-align:right;line-height:1.75}

  .chiprow{display:flex;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--dim);line-height:1.8}
  .chip{color:var(--dim)}
  .chip + .chip::before{content:"·";margin:0 6px;color:#C9CDD4}
  .chip.ok{color:#009A29}
  .chip.warn{color:var(--amber)}

  .footrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
  .footrow a{color:var(--primary);font-size:12.5px;text-decoration:none;font-weight:500}
  .footrow .spacer{flex:1}
  .tiny{border:1px solid var(--line-strong);background:#fff;color:var(--sub);
    border-radius:6px;padding:5px 12px;font-size:12.5px;font-weight:500;line-height:1.5}
  .tiny:active{background:var(--fill)}
  .note{font-size:12.5px;color:var(--sub);margin-top:10px;line-height:1.6}

  /* ---------- 底部操作条 ---------- */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:0 12px calc(12px + var(--safe));display:flex;justify-content:center;pointer-events:none}
  .dock .inner{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:6px;
    border-radius:10px;background:rgba(255,255,255,.94);border:1px solid var(--line);
    box-shadow:0 6px 20px rgba(29,33,41,.1);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .dock button{border:0;background:transparent;color:var(--sub);font:inherit;font-size:13.5px;
    font-weight:500;padding:8px 15px;border-radius:6px;display:flex;align-items:center;gap:5px}
  .dock button:active{background:var(--fill)}
  .dock button.accent{color:#fff;background:var(--primary)}
  .dock button.accent:active{background:var(--primary-deep)}
  .dock svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}

  .empty{padding:40px 16px;text-align:center;color:var(--dim);font-size:13px;
    background:#fff;border:1px dashed var(--line-strong);border-radius:8px}

  /* ---------- 弹层 ---------- */
  .sheet-bg{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;
    background:rgba(29,33,41,.45)}
  .sheet-bg.on{display:flex}
  .sheet{width:100%;max-width:600px;max-height:88vh;overflow:auto;
    padding:18px 16px calc(20px + var(--safe));
    background:#fff;border-radius:12px 12px 0 0;
    box-shadow:0 -6px 24px rgba(29,33,41,.12);
    animation:up .22s cubic-bezier(.2,.8,.3,1)}
  @keyframes up{from{transform:translateY(22px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h3{margin:0 0 6px;font-size:16px;font-weight:600;color:var(--txt)}
  .sheet p{color:var(--sub);font-size:12.5px;margin:0 0 16px;line-height:1.6}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
  input,select{width:100%;background:#fff;border:1px solid var(--line-strong);
    border-radius:6px;color:var(--txt);padding:9px 12px;font:inherit;font-size:14px;outline:none;
    height:38px}
  input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(51,112,255,.12)}
  .btnrow{display:flex;gap:8px;margin-top:10px}
  .btnrow button{flex:1;border-radius:6px;padding:9px;font-size:14px;font-weight:500;
    border:1px solid var(--line-strong);background:#fff;color:var(--sub)}
  .btnrow button:active{background:var(--fill)}
  .btnrow button.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btnrow button.primary:active{background:var(--primary-deep)}
  .hint{color:var(--dim);font-size:11.5px;margin-top:12px;line-height:1.6}

  /* ---------- 解锁页 ---------- */
  .gate{max-width:360px;margin:14vh auto 0;padding:28px 22px 24px;text-align:center;
    background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
  .gate .ring{width:52px;height:52px;margin:0 auto 16px;border-radius:50%;position:relative;
    background:linear-gradient(160deg,#4E83FD,#2E62D9);
    display:grid;place-items:center}
  .gate .ring::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;
    background:#fff;opacity:0}
  .gate .ring::before{content:"";position:absolute;inset:0;border-radius:50%;
    background:
      linear-gradient(#fff,#fff) 50% 40%/20px 2.4px no-repeat,
      linear-gradient(#fff,#fff) 50% 50%/14px 2.4px no-repeat,
      linear-gradient(#fff,#fff) 50% 60%/8px 2.4px no-repeat}
  .gate h2{font-size:18px;margin:0 0 8px;font-weight:600;color:var(--txt)}
  .gate p{color:var(--sub);font-size:12.5px;margin:0 0 20px;line-height:1.7}
  .gate input{text-align:center;letter-spacing:.4em;font-size:18px;font-weight:600;
    text-indent:.4em;height:44px}
  .gate .btnrow{margin-top:14px}

  .toast{position:fixed;left:50%;bottom:calc(92px + var(--safe));transform:translateX(-50%) translateY(6px);
    z-index:60;max-width:84vw;padding:9px 15px;border-radius:6px;font-size:13px;text-align:center;
    background:rgba(29,33,41,.88);color:#fff;opacity:0;transition:.2s;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .fade{animation:fade .3s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>

<script>
/* =========================================================
   额度中枢 · 手机端单文件应用
   - 所有请求直接从手机发起，不经过任何服务器
   - 密钥 AES-256-GCM 加密后存本机，解锁才可用；只展示指纹
   ========================================================= */
const LS_VAULT = 'lqh.vault.v1';
const LS_META  = 'lqh.meta.v1';
const AUTO_LOCK_MS = 5 * 60 * 1000;

let S = { providers: [], unlocked: false, key: null, salt: null, idleAt: Date.now(), timer: null };
const $ = s => document.querySelector(s);
const toastEl = $('#toast');

const TYPE_TXT = { token_plan:'TOKEN PLAN', coding_plan:'CODING PLAN', balance:'BALANCE', usage:'USAGE' };
const MODEL_TXT = { general:'通用', video:'视频', audio:'语音', image:'图像', music:'音乐', general_text:'通用', general_image:'图像' };
const KEY_URL = {
  minimax:'https://platform.minimaxi.com/user-center/basic-information/interface-key',
  kimi:'https://platform.moonshot.cn/console/api-keys',
  deepseek:'https://platform.deepseek.com/api_keys',
  glm:'https://bigmodel.cn/usercenter/proj-mgmt/apikeys'
};
const ST_TXT = { ok:'正常', expiring:'即将到期', error:'异常', unauthenticated:'未配置', disabled:'已停用' };

const DEFAULT_PROVIDERS = [
  { id:'minimax', name:'MiniMax', type:'token_plan', authKind:'api_key', apiKey:'',
    note:'Token Plan 周期额度', base:'https://api.minimaxi.com',
    links:[{label:'控制台',url:'https://platform.minimaxi.com/subscribe/token-plan'}] },
  { id:'kimi', name:'Kimi', type:'balance', authKind:'api_key', apiKey:'',
    note:'按量计费，展示可用余额',
    links:[{label:'控制台',url:'https://platform.moonshot.cn/console/info'}] },
  { id:'deepseek', name:'DeepSeek', type:'balance', authKind:'api_key', apiKey:'',
    note:'按量计费，展示剩余金额',
    links:[{label:'用量',url:'https://platform.deepseek.com/usage'}] },
  { id:'glm', name:'智谱 GLM', type:'coding_plan', authKind:'api_key', apiKey:'',
    note:'套餐额度未开放查询接口',
    links:[{label:'用量',url:'https://bigmodel.cn/usercenter/usagestatistics'}] }
];

/* ---------------- 工具 ---------------- */
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(()=>toastEl.classList.remove('on'), 2200); }
function fmtTime(ts){ if(!ts) return '—'; const d = new Date(ts); if (isNaN(d)) return '—';
  return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function ago(ts){ if(!ts) return '—'; const t = new Date(ts).getTime(); if (isNaN(t)) return '—';
  const m = Math.floor(Math.max(0, Date.now()-t)/60000);
  if (m < 1) return '刚刚'; if (m < 60) return m + ' 分钟前';
  const h = Math.floor(m/60); if (h < 24) return h + ' 小时前'; return Math.floor(h/24) + ' 天前'; }
function until(ts){ if(!ts) return ''; const t = new Date(ts).getTime(); if (isNaN(t)) return '';
  const ms = t - Date.now(); if (ms <= 0) return '待刷新';
  const h = ms/3600000;
  if (h < 1) return Math.round(ms/60000) + ' 分钟后重置';
  if (h < 48) return h.toFixed(1) + ' 小时后重置';
  return Math.floor(h/24) + ' 天后重置'; }
function tone(p, invert){ if (p == null) return '';
  const v = invert ? 100 - p : p;
  if (v < 15) return 'low'; if (v < 40) return 'warn'; return 'ok'; }

/* ---------------- 加密存储 ---------------- */
async function deriveKey(pin, salt){
  const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations: 210000, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function encryptVault(data, key){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, enc.encode(JSON.stringify(data)));
  return { iv: b64(iv), ct: b64(ct) };
}
async function decryptVault(box, key){
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: unb64(box.iv) }, key, unb64(box.ct));
  return JSON.parse(dec.decode(pt));
}
async function fingerprint(secret){
  if(!secret) return null;
  const h = await crypto.subtle.digest('SHA-256', enc.encode(secret));
  return [...new Uint8Array(h)].slice(0,5).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function persist(){
  const box = await encryptVault({ providers: S.providers }, S.key);
  localStorage.setItem(LS_VAULT, JSON.stringify({ salt: b64(S.salt), iv: box.iv, ct: box.ct }));
  localStorage.setItem(LS_META, JSON.stringify({
    providers: S.providers.map(p => ({ id:p.id, name:p.name, type:p.type, keyFp:p.keyFp || null }))
  }));
}

/* ---------------- 解锁 / 初始化 ---------------- */
function renderGate(mode){
  const isInit = mode === 'init';
  $('#app').innerHTML = `
    <div class="gate fade">
      <div class="ring"></div>
      <h2>${isInit ? '设置访问密码' : '额度中枢'}</h2>
      <p>${isInit
        ? '设置一个 PIN，用于加密保存在本机的各家密钥。<br>忘记 PIN 只能清空重配，密钥无法找回。'
        : '密钥已加密保存在这台手机上，输入 PIN 解锁。'}</p>
      <div class="field"><input id="pin" type="password" inputmode="numeric" maxlength="8"
        placeholder="${isInit ? '4–8 位数字' : '输入 PIN'}" autocomplete="off"></div>
      ${isInit ? `<div class="field"><input id="pin2" type="password" inputmode="numeric" maxlength="8"
        placeholder="再输一次" autocomplete="off"></div>` : ''}
      <div class="btnrow"><button class="primary" id="gateGo">${isInit ? '创建并进入' : '解锁'}</button></div>
      <div class="hint">密钥不会离开这台手机，页面只保存密文和指纹。</div>
      ${isInit ? '' : '<div class="hint" style="margin-top:22px"><a href="#" id="resetAll" style="color:#f87171;text-decoration:none">忘记 PIN · 清空全部配置</a></div>'}
    </div>`;
  $('#gateGo').onclick = async () => {
    const pin = $('#pin').value.trim();
    if (!/^\d{4,8}$/.test(pin)) return toast('PIN 需 4–8 位数字');
    if (isInit){
      if (pin !== $('#pin2').value.trim()) return toast('两次输入不一致');
      S.salt = crypto.getRandomValues(new Uint8Array(16));
      S.key = await deriveKey(pin, S.salt);
      S.providers = DEFAULT_PROVIDERS.map(p => ({ ...p }));
      S.unlocked = true;
      await persist();
      render();
      toast('已创建，先给各家填 Key');
    } else {
      const box = JSON.parse(localStorage.getItem(LS_VAULT) || '{}');
      try {
        S.salt = unb64(box.salt);
        S.key = await deriveKey(pin, S.salt);
        S.providers = (await decryptVault(box, S.key)).providers;
        S.unlocked = true;
        render();
      } catch { toast('PIN 不正确'); }
    }
  };
  const rs = $('#resetAll');
  if (rs) rs.onclick = (e) => {
    e.preventDefault();
    if (confirm('清空后本机保存的所有密钥都会删除，且无法恢复。继续？')){
      localStorage.removeItem(LS_VAULT); localStorage.removeItem(LS_META);
      location.reload();
    }
  };
}

function lock(){
  S.unlocked = false; S.key = null; S.providers = [];
  const meta = JSON.parse(localStorage.getItem(LS_META) || '{}');
  if (!meta.providers) return location.reload();
  renderLocked(meta.providers);
}
function renderLocked(list){
  $('#app').innerHTML = `
    <div class="topbar">
      <div class="brand"><div class="mark"></div><div><h1>额度中枢</h1>
        <div class="meta-line">已锁定</div></div></div>
    </div>
    ${list.map(p => `<div class="card">
      <div class="chead"><span class="dot"></span><span class="pname">${esc(p.name)}</span>
        <span class="spacer"></span><span class="badge ${esc(p.type)}">${TYPE_TXT[p.type]||''}</span></div>
      <div class="note">${p.keyFp ? '密钥已加密保存在本机 · 指纹 ' + esc(p.keyFp) : '未配置密钥'}</div>
    </div>`).join('')}
    <div class="dock"><div class="inner">
      <button class="accent" onclick="location.reload()">输入 PIN 解锁</button>
    </div></div>`;
}

/* ---------------- 额度适配器（手机直连） ---------------- */
async function jget(url, key, opts = {}){
  const r = await fetch(url, {
    method: opts.method || 'GET',
    headers: { Authorization: 'Bearer ' + key, ...(opts.headers || {}) },
    body: opts.body
  });
  const text = await r.text();
  let body; try { body = JSON.parse(text); } catch { body = text; }
  if (!r.ok) {
    const msg = (body && body.error && (body.error.message || body.error.code)) || (body && body.base_resp && body.base_resp.status_msg) || ('HTTP ' + r.status);
    const e = new Error(String(msg).slice(0, 120)); e.status = r.status; throw e;
  }
  return body;
}

function minimaxGroups(model_remains){
  return (model_remains || []).map(m => {
    const boost = Number(m.weekly_boost_permille || 1000);
    const totalPct = boost / 10;
    const iTotal = Number(m.current_interval_total_count || 0);
    const iUsed  = Number(m.current_interval_usage_count || 0);
    const wTotal = Number(m.current_weekly_total_count || 0);
    const wUsed  = Number(m.current_weekly_usage_count || 0);
    return {
      name: MODEL_TXT[m.model_name] || m.model_name,
      raw: m.model_name,
      interval: {
        pct: Number(m.current_interval_remaining_percent ?? 100),
        resetAt: m.end_time,
        text: iTotal > 0 ? `已用 ${iUsed} / ${iTotal} 次` : '不限次数，按 token 计'
      },
      weekly: {
        pct: Number(m.current_weekly_remaining_percent ?? 100),
        resetAt: m.weekly_end_time,
        boost: totalPct,
        text: (wTotal > 0 ? `已用 ${wUsed} / ${wTotal} 次 · ` : '') + `额度基准 ${totalPct}%`
      }
    };
  });
}

/** 读取云端同步下来的 OAuth 额度快照（同源，无需任何 Key） */
async function cloudSnapshot(){
  try {
    const r = await fetch('data/minimax.json', { cache: 'no-store' });
    if (!r.ok) return null;
    const d = await r.json();
    if (!d || !d.model_remains) return null;
    return d;
  } catch { return null; }
}

async function statusOf(p){
  const out = { id:p.id, name:p.name, type:p.type, authKind:p.authKind, links:p.links||[],
                note:p.note||'', keyFp:p.keyFp||null, keySaved: !!p.apiKey, metrics:[] };
  if (!p.apiKey) {
    if (p.id === 'minimax') {
      const snap = await cloudSnapshot();
      if (snap) {
        out.groups = minimaxGroups(snap.model_remains);
        if (snap.balance) {
          out.balance = {
            amount: Number(snap.balance.available_amount || 0),
            cash: Number(snap.balance.cash_balance || 0),
            voucher: Number(snap.balance.voucher_balance || 0),
            currency: 'CNY'
          };
        }
        out.status = 'ok';
        out.mode = 'oauth';
        out.cloudSynced = true;
        out.syncedAt = snap.updated_at;
        out.note = '云端 OAuth 授权同步，无需在本机填 Key';
        out.updatedAt = Date.now();
        return out;
      }
    }
    return { ...out, status:'unauthenticated',
      note:'本机还没有凭证。可点「配置」填 API Key，或让我发起云端 OAuth 授权。' };
  }

  try {
    if (p.id === 'minimax'){
      const base = p.base || 'https://api.minimaxi.com';
      const d = await jget(base + '/v1/token_plan/remains', p.apiKey);
      out.groups = minimaxGroups(d.model_remains);
      try {
        const bl = await jget(base + '/account/query_balance', p.apiKey);
        if (bl && Number(bl.available_amount || 0) >= 0) {
          out.balance = {
            amount: Number(bl.available_amount || 0),
            cash: Number(bl.cash_balance || 0),
            voucher: Number(bl.voucher_balance || 0),
            currency: 'CNY'
          };
        }
      } catch (e) {}
      out.status = 'ok'; out.note = 'Token Plan 实时额度（本机直连）';
    }
    else if (p.id === 'kimi' || p.id === 'moonshot'){
      const d = await jget('https://api.moonshot.cn/v1/users/me/balance', p.apiKey);
      const b = (d && d.data) || {};
      out.balance = { amount: Number(b.available_balance ?? 0), voucher: Number(b.voucher_balance ?? 0), currency:'CNY' };
      out.metrics = [{ label:'代金券余额', pct:null, text:`¥${Number(b.voucher_balance ?? 0).toFixed(2)}` }];
      out.status = 'ok'; out.note = '按量计费，余额实时';
    }
    else if (p.id === 'deepseek'){
      const d = await jget('https://api.deepseek.com/user/balance', p.apiKey);
      const infos = d.balance_infos || [];
      const f = infos[0] || {};
      out.balance = { amount: Number(f.total_balance ?? 0), currency: f.currency || 'CNY' };
      out.metrics = infos.slice(1).map(i => ({ label:i.currency, pct:null,
        text:`总额 ${i.total_balance} · 赠金 ${i.granted_balance}` }));
      out.status = d.is_available === false ? 'expiring' : 'ok';
      out.note = d.is_available === false ? '余额不足' : '按量计费，余额实时';
    }
    else if (p.id === 'glm'){
      await jget('https://open.bigmodel.cn/api/paas/v4/models', p.apiKey);
      out.metrics = [{ label:'Coding Plan 额度', pct:null, text:'平台未开放查询接口' }];
      out.status = 'ok'; out.note = 'Key 有效；套餐剩余请在控制台查看';
    }
    else {
      out.status = 'ok';
      out.metrics = [{ label:'额度', pct:null, text:'预留位，待接入适配器' }];
    }
  } catch (e) {
    out.status = (e.status === 401 || e.status === 403) ? 'unauthenticated' : 'error';
    out.note = '拉取失败：' + e.message;
  }
  out.updatedAt = Date.now();
  return out;
}

/* ---------------- 渲染 ---------------- */
let ST = [];

function donutSvg(pct){
  const c = 2 * Math.PI * 18;
  const p = Math.max(0, Math.min(100, pct == null ? 0 : pct));
  const off = c * (1 - p / 100);
  const stroke = p >= 40 ? '#34d399' : p >= 15 ? '#fbbf24' : '#f87171';
  return `<div class="donut-wrap">
    <svg class="donut" viewBox="0 0 44 44">
      <circle class="track" cx="22" cy="22" r="18"></circle>
      <circle class="arc" cx="22" cy="22" r="18"
        style="stroke:${stroke};stroke-dasharray:${c.toFixed(1)};stroke-dashoffset:${off.toFixed(1)}"></circle>
    </svg>
    <div class="dv"><b>${Math.round(p)}%</b><span>本周</span></div>
  </div>`;
}

function groupsHtml(groups){
  return groups.map(g => {
    const i = g.interval, w = g.weekly;
    return `<div class="model">
      <div class="mhead"><span class="mname">${esc(g.name)}<em>${esc(g.raw || '')}</em></span></div>
      <div class="mrow">
        <div class="mlab"><span>当期 5 小时窗</span><b>${i.pct}%</b></div>
        <div class="bar"><i class="${tone(i.pct)}" style="width:${Math.max(0,Math.min(100,i.pct))}%"></i></div>
        <div class="mhint">${esc(i.text)}${i.resetAt ? ' · ' + until(i.resetAt) : ''}</div>
      </div>
      <div class="mrow">
        <div class="mlab"><span>本周总额度</span><b>${w.pct}%</b></div>
        <div class="bar"><i class="${tone(w.pct)}" style="width:${Math.max(0,Math.min(100,w.pct))}%"></i></div>
        <div class="mhint">${esc(w.text)}${w.resetAt ? ' · ' + until(w.resetAt) : ''}</div>
      </div>
    </div>`;
  }).join('');
}

function metricsHtml(metrics){
  return (metrics || []).map(m => {
    const pct = (m.pct == null) ? null : Math.max(0, Math.min(100, m.pct));
    return `<div class="mrow">
      <div class="mlab"><span>${esc(m.label)}</span>${pct == null ? '' : `<b>${pct}%</b>`}</div>
      ${pct == null ? '' : `<div class="bar"><i class="${tone(pct)}" style="width:${pct}%"></i></div>`}
      <div class="mhint">${esc(m.text || '')}${m.resetAt ? ' · ' + until(m.resetAt) : ''}</div>
    </div>`;
  }).join('');
}

function render(){
  if (!S.unlocked) return;

  const cards = ST.length ? ST.map(p => {
    const type = p.type || 'usage';
    const st = p.status || 'error';
    const groups = p.groups || [];
    const pcts = [];
    groups.forEach(g => { pcts.push(g.interval.pct, g.weekly.pct); });
    (p.metrics || []).forEach(m => { if (m.pct != null) pcts.push(m.pct); });

    const intervalPcts = groups.map(g => g.interval.pct);
    const weeklyPcts = groups.map(g => g.weekly.pct);
    const minOf = arr => arr.length ? Math.min(...arr) : null;

    const heroes = groups.length ? `<div class="heroes">
      <div class="tile"><div class="k">当期剩余</div>
        <div class="v">${minOf(intervalPcts)}<small>%</small></div>
        <div class="hint">各模型最低 · 5 小时窗</div></div>
      <div class="tile"><div class="k">本周剩余</div>
        <div class="v">${minOf(weeklyPcts)}<small>%</small></div>
        <div class="hint">基准 ${Math.max(...groups.map(g => g.weekly.boost || 100))}% · 各模型最低</div></div>
    </div>` : '';

    const money = p.balance ? `<div class="money">
      <div class="amt">¥${Number(p.balance.amount).toFixed(2)}<small>${esc(p.balance.currency || 'CNY')} 可用</small></div>
      ${(p.balance.cash != null || p.balance.voucher != null) ? `<div class="split">
        现金 ¥${Number(p.balance.cash || 0).toFixed(2)}<br>代金券 ¥${Number(p.balance.voucher || 0).toFixed(2)}
      </div>` : ''}
    </div>` : '';

    const chips = `<div class="chiprow">
      <span class="chip ${st === 'ok' ? 'ok' : 'warn'}">${ST_TXT[st] || st}</span>
      ${p.cloudSynced ? `<span class="chip">云端同步 ${ago(p.syncedAt)}</span>` : ''}
      ${p.keySaved ? `<span class="chip">本机密钥 ${esc(p.keyFp || '')}</span>` : ''}
      ${p.syncedAt ? `<span class="chip">快照 ${fmtTime(p.syncedAt)}</span>` : ''}
    </div>`;

    return `<div class="card s-${esc(st)}">
      <div class="chead">
        <span class="dot"></span><span class="pname">${esc(p.name)}</span>
        <span class="badge ${esc(type)}">${TYPE_TXT[type] || type}</span>
        <span class="spacer"></span>
        <span class="state ${st === 'ok' ? '' : 'warn'}">${ST_TXT[st] || st}</span>
      </div>
      ${heroes}
      ${groups.length ? `<div class="sec-title">模型明细</div>${groupsHtml(groups)}` : ''}
      ${metricsHtml(p.metrics)}
      ${money}
      ${chips}
      ${p.note ? `<div class="note">${esc(p.note)}</div>` : ''}
      <div class="footrow">
        ${(p.links || []).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noreferrer">${esc(l.label)} ›</a>`).join('')}
        ${(!p.keySaved && KEY_URL[p.id]) ? `<a href="${KEY_URL[p.id]}" target="_blank" rel="noreferrer" style="color:#7fb6ff">建 Key ›</a>` : ''}
        <span class="spacer"></span>
        <button class="tiny" onclick="editKey('${esc(p.id)}')">${p.keySaved ? '替换 Key' : '配置 Key'}</button>
      </div>
    </div>`;
  }).join('') : '<div class="empty">还没有平台，点「接入」添加一个。</div>';

  const synced = ST.find(x => x.syncedAt)?.syncedAt;
  $('#app').innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="mark"></div>
        <div><h1>额度中枢</h1>
          <div class="meta-line">${synced ? '数据 ' + ago(synced) : '未同步'}</div></div>
      </div>
      <button class="lockbtn" id="btnLock" aria-label="锁定">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/>
          <path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></svg>
      </button>
    </div>
    <div class="fade">${cards}</div>
    <div class="dock"><div class="inner">
      <button id="btnRefresh">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>刷新</button>
      <button id="btnAdd">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>接入</button>
      <button id="btnLock2">
        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></svg>锁定</button>
    </div></div>`;

  $('#btnLock').onclick = lock;
  $('#btnLock2').onclick = lock;
  $('#btnAdd').onclick = addSheet;
  $('#btnRefresh').onclick = () => refresh(true);
}

async function refresh(manual){
  if (!S.unlocked) return;
  if (manual) toast('正在刷新…');
  ST = await Promise.all(S.providers.map(statusOf));
  render();
  if (manual) toast('已刷新');
}

/* ---------------- 配置 Key ---------------- */
function editKey(id){
  const p = S.providers.find(x => x.id === id);
  if (!p) return;
  openSheet(`<h3>${esc(p.name)}</h3>
    <p>Key 以 AES-256-GCM 加密后存进这台手机，页面只显示指纹，不显示 Key 本体。</p>
    <div class="field"><label>API KEY</label>
      <input id="k" type="password" placeholder="粘贴 Key" autocomplete="off" spellcheck="false" autocapitalize="off">
      <button class="tiny" style="margin-top:8px" onclick="const e=document.getElementById('k');e.type=e.type==='password'?'text':'password'">显示 / 隐藏</button>
    </div>
    ${p.id === 'minimax' ? `<div class="field"><label>区域</label>
      <select id="base">
        <option value="https://api.minimaxi.com">国内 · api.minimaxi.com</option>
        <option value="https://api.minimax.io">海外 · api.minimax.io</option>
      </select></div>` : ''}
    <div class="btnrow">
      <button onclick="closeSheet()">取消</button>
      <button class="primary" onclick="saveKey('${id}')">保存</button>
    </div>
    ${p.apiKey ? `<div class="btnrow" style="margin-top:10px">
      <button onclick="dropKey('${id}')" style="color:#f87171">解绑并删除密钥</button></div>` : ''}`);
}

async function saveKey(id){
  const p = S.providers.find(x => x.id === id);
  const el = $('#k'); const v = el.value.trim();
  if (!v) return toast('请先填入 Key');
  p.apiKey = v;
  p.keyFp = await fingerprint(v);
  const sel = $('#base'); if (sel) p.base = sel.value;
  el.value = '';
  await persist();
  closeSheet();
  toast('已加密保存 · 指纹 ' + p.keyFp);
  await refresh();
}

async function dropKey(id){
  if (!confirm('删除后本机不再保存这把 Key，调用将不可用。继续？')) return;
  const p = S.providers.find(x => x.id === id);
  p.apiKey = ''; p.keyFp = null;
  await persist(); closeSheet(); toast('已解绑'); await refresh();
}

/* ---------------- 接入新平台 ---------------- */
function addSheet(){
  openSheet(`<h3>接入新平台</h3>
    <p>先建卡片占位，额度类型决定它怎么展示。</p>
    <div class="field"><label>平台名称</label><input id="nName" placeholder="如 通义 / 火山方舟"></div>
    <div class="field"><label>额度类型</label><select id="nType">
      <option value="token_plan">Token Plan · 周期配额</option>
      <option value="coding_plan">Coding Plan · 套餐额度</option>
      <option value="balance">Balance · 账户余额</option>
      <option value="usage">Usage · 按量明细</option></select></div>
    <div class="field"><label>备注（可选）</label><input id="nNote" placeholder="预留位说明"></div>
    <div class="btnrow"><button onclick="closeSheet()">取消</button>
      <button class="primary" onclick="createProvider()">创建</button></div>`);
}
async function createProvider(){
  const name = $('#nName').value.trim();
  if (!name) return toast('请填平台名称');
  S.providers.push({
    id: 'c' + Date.now().toString(36), name,
    type: $('#nType').value, authKind:'api_key', apiKey:'',
    note: $('#nNote').value.trim() || '预留位，待接入适配器', links:[]
  });
  await persist(); closeSheet(); toast('已添加'); await refresh();
}

/* ---------------- 弹层 ---------------- */
function openSheet(html){ $('#sheet').innerHTML = html; $('#sheetBg').classList.add('on'); }
function closeSheet(){ $('#sheetBg').classList.remove('on'); }
$('#sheetBg').addEventListener('click', e => { if (e.target.id === 'sheetBg') closeSheet(); });

/* ---------------- 下拉刷新 ---------------- */
let ptY = null;
addEventListener('touchstart', e => { if (scrollY <= 0) ptY = e.touches[0].clientY; }, { passive:true });
addEventListener('touchmove', e => {
  if (ptY != null && scrollY <= 0 && e.touches[0].clientY - ptY > 76) { ptY = null; refresh(true); }
}, { passive:true });
addEventListener('touchend', () => { ptY = null; }, { passive:true });

/* ---------------- 自动锁定 ---------------- */
['click','keydown','touchstart'].forEach(ev => document.addEventListener(ev, () => { S.idleAt = Date.now(); }, { passive:true }));
setInterval(() => { if (S.unlocked && Date.now() - S.idleAt > AUTO_LOCK_MS) { lock(); toast('已自动锁定'); } }, 20000);

/* ---------------- 启动 ---------------- */
(async function boot(){
  if (!localStorage.getItem(LS_VAULT)) return renderGate('init');
  renderGate('unlock');
})();
</script>
